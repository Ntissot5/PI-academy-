# Production (Dokploy) : une seule adresse publique.
#   Dokploy → Create Service → Compose → ce dépôt, fichier docker-compose.prod.yml
#   Domaine : service « proxy », port 80 (Dokploy ajoute le HTTPS).
# Variables (onglet Environment) : PB_SUPERUSER_EMAIL, PB_SUPERUSER_PASSWORD (compte d'administration PocketBase).
services:
  pocketbase:
    build: ./pocketbase
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-}
    volumes:
      - pb_data:/pb/pb_data
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        # Même adresse que le site : le proxy envoie /api et /_ à PocketBase.
        NEXT_PUBLIC_PB_URL: "/"
    depends_on:
      - pocketbase
    restart: unless-stopped

  proxy:
    build: ./deploy/caddy
    depends_on:
      - web
      - pocketbase
    restart: unless-stopped

volumes:
  pb_data:
